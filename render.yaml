services:
  - type: web
    name: bromise
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: bromise-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: NODE_VERSION
        value: "22"
